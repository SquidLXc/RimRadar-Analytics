openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Rim Radar NBA basketball analytics API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: games
  - name: players
  - name: teams
  - name: props
  - name: analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /nba/data-status:
    get:
      operationId: getNbaDataStatus
      tags: [dashboard]
      summary: Get NBA data provider status
      responses:
        "200":
          description: Data mode and source status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStatus"
  /nba/dashboard/summary:
    get:
      operationId: getNbaDashboardSummary
      tags: [dashboard]
      summary: Get the NBA dashboard summary
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /nba/games:
    get:
      operationId: getNbaGames
      tags: [games]
      summary: List NBA games
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
        - in: query
          name: status
          schema:
            type: string
            enum: [scheduled, live, final]
      responses:
        "200":
          description: NBA games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /nba/games/today:
    get:
      operationId: getNbaTodayGames
      tags: [games]
      summary: List today's NBA games
      responses:
        "200":
          description: Today's games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /nba/games/future:
    get:
      operationId: getNbaFutureGames
      tags: [games]
      summary: List upcoming NBA games
      responses:
        "200":
          description: Upcoming games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /nba/games/{gameId}:
    get:
      operationId: getNbaGame
      tags: [games]
      summary: Get an NBA game
      parameters:
        - in: path
          name: gameId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Game not found
  /nba/players:
    get:
      operationId: getNbaPlayers
      tags: [players]
      summary: Search NBA players
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: team
          schema:
            type: string
      responses:
        "200":
          description: NBA players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
  /nba/players/{playerId}:
    get:
      operationId: getNbaPlayer
      tags: [players]
      summary: Get an NBA player profile
      parameters:
        - in: path
          name: playerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player profile and recent game log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDetail"
        "404":
          description: Player not found
  /nba/teams:
    get:
      operationId: getNbaTeams
      tags: [teams]
      summary: List NBA teams
      responses:
        "200":
          description: NBA teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
  /nba/teams/{teamId}:
    get:
      operationId: getNbaTeam
      tags: [teams]
      summary: Get an NBA team profile
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Team profile and roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetail"
        "404":
          description: Team not found
  /nba/props:
    get:
      operationId: getNbaProps
      tags: [props]
      summary: List NBA player props
      parameters:
        - in: query
          name: market
          schema:
            $ref: "#/components/schemas/Market"
      responses:
        "200":
          description: NBA player props
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prop"
  /nba/picks:
    get:
      operationId: getNbaPicks
      tags: [analytics]
      summary: List ranked player-prop edges
      parameters:
        - in: query
          name: market
          schema:
            $ref: "#/components/schemas/Market"
      responses:
        "200":
          description: Model-generated picks from DunkAPI player props. Empty when no key is configured or no edge clears the threshold.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pick"
  /nba/picks/status:
    get:
      operationId: getNbaPicksStatus
      tags: [analytics]
      summary: Get the picks model and provider status
      responses:
        "200":
          description: Model status and credit usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicksStatus"
  /nba/first-basket:
    get:
      operationId: getNbaFirstBasket
      tags: [analytics]
      summary: List model probabilities for the first made basket of each game
      responses:
        "200":
          description: First-basket tracker entries with model probability, fair price and grading result. Empty when no key is configured or no games are upcoming.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FirstBasketEntry"
  /nba/first-basket/status:
    get:
      operationId: getNbaFirstBasketStatus
      tags: [analytics]
      summary: Get first-basket model and provider status
      responses:
        "200":
          description: First-basket model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstBasketStatus"
  /nba/first-basket/alerts:
    get:
      operationId: getNbaFirstBasketAlerts
      tags: [analytics]
      summary: Get confirmed first-basket events from today's ESPN games
      responses:
        "200":
          description: Live or final first-basket alerts. Empty until a game starts and the first field goal is confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstBasketAlerts"
  /nba/matchups:
    get:
      operationId: getNbaMatchups
      tags: [analytics]
      summary: List team and game matchup analysis
      responses:
        "200":
          description: Matchup analysis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Matchup"
  /nba/live-alerts:
    get:
      operationId: getNbaLiveAlerts
      tags: [dashboard]
      summary: Get confirmed NBA live-game events
      responses:
        "200":
          description: Live alert feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveAlerts"
  /nba/model-performance:
    get:
      operationId: getNbaModelPerformance
      tags: [analytics]
      summary: Get model performance by market
      responses:
        "200":
          description: Model performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelPerformance"
  /nba/audit:
    get:
      operationId: getNbaAudit
      tags: [analytics]
      summary: Get model reasoning and data audit records
      responses:
        "200":
          description: Audit records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditRecord"
  /nba/odds:
    get:
      operationId: getNbaOdds
      tags: [analytics]
      summary: Get game-level sportsbook odds
      responses:
        "200":
          description: Odds by game and sportsbook. No prices are fabricated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsFeed"
  /admin/data-health:
    get:
      operationId: getDataHealth
      tags: [health]
      summary: Get provider import health
      responses:
        "200":
          description: Provider health and import counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataHealth"
  /admin/sync:
    post:
      operationId: syncNbaData
      tags: [health]
      summary: Refresh the provider cache and report import counts
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
  /admin/model/refresh:
    post:
      operationId: refreshNbaModel
      tags: [health]
      summary: Clear the picks and first-basket model caches
      responses:
        "200":
          description: Cache clear result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRefreshResult"
  /community/discord:
    get:
      operationId: getDiscordLink
      tags: [community]
      summary: Get the configured Discord invite or OAuth join link
      responses:
        "200":
          description: Discord join configuration. Nothing is fabricated when no invite or OAuth app is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLink"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DataStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [demo, live, stale, unavailable]
        provider:
          type: string
        lastUpdated:
          type: ["string", "null"]
          format: date-time
        message:
          type: string
      required: [mode, provider, lastUpdated, message]
    Market:
      type: string
      enum: [points, rebounds, assists, threes, steals, blocks, turnovers, pra, first_basket]
    Team:
      type: object
      properties:
        id: { type: string }
        abbreviation: { type: string }
        name: { type: string }
        city: { type: string }
        conference: { type: string, enum: [East, West] }
        division: { type: string }
        color: { type: string }
        logoUrl: { type: [string, "null"], format: uri }
      required: [id, abbreviation, name, city, conference, division, color, logoUrl]
    Game:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date }
        tipoff: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, live, final] }
        homeTeam: { $ref: "#/components/schemas/Team" }
        awayTeam: { $ref: "#/components/schemas/Team" }
        homeScore: { type: ["integer", "null"] }
        awayScore: { type: ["integer", "null"] }
        period: { type: ["integer", "null"] }
        clock: { type: ["string", "null"] }
        venue: { type: ["string", "null"] }
      required: [id, date, tipoff, status, homeTeam, awayTeam, homeScore, awayScore, period, clock, venue]
    Player:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        team: { $ref: "#/components/schemas/Team" }
        position: { type: string }
        jerseyNumber: { type: ["string", "null"] }
        status: { type: string }
        headshotUrl: { type: ["string", "null"], format: uri }
        points: { type: [number, "null"], description: Season average. Null when the provider has not supplied it. }
        rebounds: { type: [number, "null"] }
        assists: { type: [number, "null"] }
        threes: { type: [number, "null"] }
        steals: { type: [number, "null"] }
        blocks: { type: [number, "null"] }
        turnovers: { type: [number, "null"] }
        minutes: { type: [number, "null"] }
        usageRate: { type: [number, "null"] }
      required: [id, name, team, position, jerseyNumber, status, headshotUrl, points, rebounds, assists, threes, steals, blocks, turnovers, minutes, usageRate]
    GameLog:
      type: object
      properties:
        date: { type: string, format: date }
        opponent: { type: string }
        minutes: { type: number }
        points: { type: integer }
        rebounds: { type: integer }
        assists: { type: integer }
        threes: { type: integer }
        steals: { type: integer }
        blocks: { type: integer }
        turnovers: { type: integer }
      required: [date, opponent, minutes, points, rebounds, assists, threes, steals, blocks, turnovers]
    PlayerDetail:
      type: object
      properties:
        player: { $ref: "#/components/schemas/Player" }
        recentGames:
          type: array
          items: { $ref: "#/components/schemas/GameLog" }
        seasonLabel: { type: ["string", "null"] }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [player, recentGames, seasonLabel, dataStatus]
    TeamDetail:
      type: object
      properties:
        team: { $ref: "#/components/schemas/Team" }
        wins: { type: ["integer", "null"] }
        losses: { type: ["integer", "null"] }
        pace: { type: ["number", "null"] }
        offensiveRating: { type: ["number", "null"] }
        defensiveRating: { type: ["number", "null"] }
        roster:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [team, wins, losses, pace, offensiveRating, defensiveRating, roster, dataStatus]
    Prop:
      type: object
      properties:
        id: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        opponent: { type: string }
        market: { $ref: "#/components/schemas/Market" }
        line: { type: ["number", "null"] }
        projection: { type: number }
        overProbability: { type: number, minimum: 0, maximum: 1, description: Probability of the over side from 0 to 1. }
        overOdds: { type: ["integer", "null"] }
        underOdds: { type: ["integer", "null"] }
        sportsbook: { type: ["string", "null"] }
        edge: { type: ["number", "null"], description: Difference between model projection and posted line in market units, not a percentage. }
        confidence: { type: string, enum: [low, medium, high] }
        rationale:
          type: array
          items: { type: string }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [id, playerId, playerName, team, opponent, market, line, projection, overProbability, overOdds, underOdds, sportsbook, edge, confidence, rationale, dataStatus]
    Pick:
      allOf:
        - $ref: "#/components/schemas/Prop"
        - type: object
          properties:
            rank: { type: integer }
            signalScore: { type: number }
          required: [rank, signalScore]
    DashboardSummary:
      type: object
      properties:
        date: { type: string, format: date }
        gamesOnSlate: { type: integer }
        liveGames: { type: integer }
        playersAnalyzed: { type: integer }
        topConfidence: { type: ["number", "null"], minimum: 0, maximum: 1, description: Highest model probability from 0 to 1. }
        topEdges:
          type: array
          items: { $ref: "#/components/schemas/Pick" }
        games:
          type: array
          items: { $ref: "#/components/schemas/Game" }
        modelVersion:
          type: string
          description: Reporting mode of the current build. Not a model claim when no model is connected.
        marketPerformance:
          type: array
          items: { $ref: "#/components/schemas/ModelPerformance" }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [date, gamesOnSlate, liveGames, playersAnalyzed, topConfidence, topEdges, games, modelVersion, marketPerformance, dataStatus]
    PicksStatus:
      type: object
      properties:
        configured: { type: boolean }
        provider: { type: string }
        modelVersion: { type: string }
        lastUpdated: { type: [string, "null"], format: date-time }
        message: { type: string }
        creditsSpent: { type: integer, description: Estimated DunkAPI credits spent by this server process. }
        creditsRemaining: { type: ["integer", "null"], description: Account balance reported by DunkAPI, when the provider sends it. }
        slateGames: { type: integer }
        playersAnalyzed: { type: integer }
        picksGenerated: { type: integer }
      required: [configured, provider, modelVersion, lastUpdated, message, creditsSpent, creditsRemaining, slateGames, playersAnalyzed, picksGenerated]
    Matchup:
      type: object
      properties:
        game: { $ref: "#/components/schemas/Game" }
        projectedPace: { type: [number, "null"] }
        projectedTotal: { type: [number, "null"] }
        homeOffenseRating: { type: [number, "null"] }
        awayOffenseRating: { type: [number, "null"] }
        notes:
          type: array
          items: { type: string }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [game, projectedPace, projectedTotal, homeOffenseRating, awayOffenseRating, notes, dataStatus]
    LiveAlert:
      type: object
      properties:
        id: { type: string }
        gameId: { type: string }
        title: { type: string }
        detail: { type: string }
        createdAt: { type: string, format: date-time }
        kind: { type: string, enum: [score, lead_change, milestone, status] }
      required: [id, gameId, title, detail, createdAt, kind]
    LiveAlerts:
      type: object
      properties:
        mode: { type: string, enum: [demo, live, waiting, unavailable] }
        events:
          type: array
          items: { $ref: "#/components/schemas/LiveAlert" }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [mode, events, dataStatus]
    ModelPerformance:
      type: object
      properties:
        market: { $ref: "#/components/schemas/Market" }
        sampleSize: { type: integer }
        hitRate: { type: ["number", "null"], minimum: 0, maximum: 1, description: Historical hit rate from 0 to 1. }
        averageError: { type: ["number", "null"] }
        roi: { type: ["number", "null"] }
        status: { type: string, enum: [demo, tracking, verified] }
      required: [market, sampleSize, hitRate, averageError, roi, status]
    OddsOutcome:
      type: object
      properties:
        name: { type: string }
        price: { type: integer, description: American odds price as reported by the provider. }
        point: { type: [number, "null"] }
      required: [name, price, point]
    OddsMarket:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/OddsOutcome" }
      required: [key, label, outcomes]
    Sportsbook:
      type: object
      properties:
        key: { type: string }
        title: { type: string }
        lastUpdate: { type: [string, "null"], format: date-time }
        markets:
          type: array
          items: { $ref: "#/components/schemas/OddsMarket" }
      required: [key, title, lastUpdate, markets]
    OddsGame:
      type: object
      properties:
        game: { $ref: "#/components/schemas/Game" }
        sportsbooks:
          type: array
          items: { $ref: "#/components/schemas/Sportsbook" }
      required: [game, sportsbooks]
    OddsFeed:
      type: object
      properties:
        configured: { type: boolean }
        provider: { type: [string, "null"] }
        priceType: { type: string, description: Type of price shown, e.g. American. }
        games:
          type: array
          items: { $ref: "#/components/schemas/OddsGame" }
      required: [configured, provider, priceType, games]
    DataHealth:
      type: object
      properties:
        provider: { type: string }
        connection: { type: string, enum: [connected, error, not_configured] }
        lastSuccessfulSync: { type: [string, "null"], format: date-time }
        lastAttemptedSync: { type: [string, "null"], format: date-time }
        teamsImported: { type: integer }
        gamesImported: { type: integer }
        playersImported: { type: integer }
        errors:
          type: array
          items: { type: string }
      required: [provider, connection, lastSuccessfulSync, lastAttemptedSync, teamsImported, gamesImported, playersImported, errors]
    SyncResult:
      type: object
      properties:
        ok: { type: boolean }
        teamsImported: { type: integer }
        gamesImported: { type: integer }
        playersImported: { type: integer }
        message: { type: string }
      required: [ok, teamsImported, gamesImported, playersImported, message]
    AuditRecord:
      type: object
      properties:
        id: { type: string }
        gameId: { type: string }
        playerId: { type: [string, "null"] }
        playerName: { type: string }
        team: { type: string }
        market: { $ref: "#/components/schemas/Market" }
        line: { type: [number, "null"] }
        projection: { type: number }
        probability: { type: number, minimum: 0, maximum: 1 }
        odds: { type: ["integer", "null"] }
        confidence: { type: string, enum: [low, medium, high] }
        modelVersion: { type: string }
        dataInputs:
          type: array
          items: { type: string }
        adjustments:
          type: array
          items: { type: string }
        recordedAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, won, lost, push] }
        actual: { type: [number, "null"] }
        actualScorer: { type: [string, "null"] }
        settledAt: { type: [string, "null"], format: date-time }
      required: [id, gameId, playerId, playerName, team, market, line, projection, probability, odds, confidence, modelVersion, dataInputs, adjustments, recordedAt, status, actual, actualScorer, settledAt]
    FirstBasketEntry:
      type: object
      properties:
        id: { type: string }
        gameId: { type: string }
        gameDate: { type: string, format: date }
        tipoff: { type: string, format: date-time }
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        opponent: { type: string }
        market: { $ref: "#/components/schemas/Market" }
        probability: { type: number, minimum: 0, maximum: 1, description: Model probability that this player scores the first made field goal. }
        fairOdds: { type: integer, description: American fair price implied by the model probability. It is not a sportsbook quote. }
        projectedPoints: { type: number, description: Projected points allocated to this player for the game. }
        usageShare: { type: number, minimum: 0, maximum: 1 }
        confidence: { type: string, enum: [low, medium, high] }
        rationale:
          type: array
          items: { type: string }
        result: { type: string, enum: [projected, pending, won, lost] }
        actualScorer: { type: [string, "null"] }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [id, gameId, gameDate, tipoff, playerId, playerName, team, opponent, market, probability, fairOdds, projectedPoints, usageShare, confidence, rationale, result, actualScorer, dataStatus]
    FirstBasketStatus:
      type: object
      properties:
        configured: { type: boolean }
        provider: { type: string }
        modelVersion: { type: string }
        lastUpdated: { type: [string, "null"], format: date-time }
        message: { type: string }
        creditsSpent: { type: integer }
        creditsRemaining: { type: ["integer", "null"] }
        gamesTracked: { type: integer }
        playersAnalyzed: { type: integer }
        entriesGenerated: { type: integer }
      required: [configured, provider, modelVersion, lastUpdated, message, creditsSpent, creditsRemaining, gamesTracked, playersAnalyzed, entriesGenerated]
    FirstBasketAlert:
      type: object
      properties:
        id: { type: string }
        gameId: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        opponent: { type: string }
        period: { type: integer }
        periodLabel: { type: string }
        clock: { type: string }
        homeTeam: { type: string }
        awayTeam: { type: string }
        homeScore: { type: ["integer", "null"] }
        awayScore: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, gameId, playerId, playerName, team, opponent, period, periodLabel, clock, homeTeam, awayTeam, homeScore, awayScore, createdAt]
    FirstBasketAlerts:
      type: object
      properties:
        mode: { type: string, enum: [live, final, waiting, unavailable] }
        events:
          type: array
          items: { $ref: "#/components/schemas/FirstBasketAlert" }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [mode, events, dataStatus]
