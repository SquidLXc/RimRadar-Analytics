openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NBA Snipes basketball analytics API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: games
  - name: players
  - name: teams
  - name: props
  - name: analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /nba/data-status:
    get:
      operationId: getNbaDataStatus
      tags: [dashboard]
      summary: Get NBA data provider status
      responses:
        "200":
          description: Data mode and source status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStatus"
  /nba/dashboard/summary:
    get:
      operationId: getNbaDashboardSummary
      tags: [dashboard]
      summary: Get the NBA dashboard summary
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /nba/games:
    get:
      operationId: getNbaGames
      tags: [games]
      summary: List NBA games
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
        - in: query
          name: status
          schema:
            type: string
            enum: [scheduled, live, final]
      responses:
        "200":
          description: NBA games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
  /nba/games/{gameId}:
    get:
      operationId: getNbaGame
      tags: [games]
      summary: Get an NBA game
      parameters:
        - in: path
          name: gameId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Game not found
  /nba/players:
    get:
      operationId: getNbaPlayers
      tags: [players]
      summary: Search NBA players
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: team
          schema:
            type: string
      responses:
        "200":
          description: NBA players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
  /nba/players/{playerId}:
    get:
      operationId: getNbaPlayer
      tags: [players]
      summary: Get an NBA player profile
      parameters:
        - in: path
          name: playerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player profile and recent game log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDetail"
        "404":
          description: Player not found
  /nba/teams:
    get:
      operationId: getNbaTeams
      tags: [teams]
      summary: List NBA teams
      responses:
        "200":
          description: NBA teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
  /nba/teams/{teamId}:
    get:
      operationId: getNbaTeam
      tags: [teams]
      summary: Get an NBA team profile
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Team profile and roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetail"
        "404":
          description: Team not found
  /nba/props:
    get:
      operationId: getNbaProps
      tags: [props]
      summary: List NBA player props
      parameters:
        - in: query
          name: market
          schema:
            $ref: "#/components/schemas/Market"
      responses:
        "200":
          description: NBA player props
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prop"
  /nba/snipes:
    get:
      operationId: getNbaSnipes
      tags: [analytics]
      summary: List ranked player-prop edges
      parameters:
        - in: query
          name: market
          schema:
            $ref: "#/components/schemas/Market"
      responses:
        "200":
          description: Ranked signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snipe"
  /nba/matchups:
    get:
      operationId: getNbaMatchups
      tags: [analytics]
      summary: List team and game matchup analysis
      responses:
        "200":
          description: Matchup analysis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Matchup"
  /nba/live-alerts:
    get:
      operationId: getNbaLiveAlerts
      tags: [dashboard]
      summary: Get confirmed NBA live-game events
      responses:
        "200":
          description: Live alert feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveAlerts"
  /nba/model-performance:
    get:
      operationId: getNbaModelPerformance
      tags: [analytics]
      summary: Get model performance by market
      responses:
        "200":
          description: Model performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelPerformance"
  /nba/audit:
    get:
      operationId: getNbaAudit
      tags: [analytics]
      summary: Get model reasoning and data audit records
      responses:
        "200":
          description: Audit records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditRecord"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DataStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [demo, live, stale, unavailable]
        provider:
          type: string
        lastUpdated:
          type: ["string", "null"]
          format: date-time
        message:
          type: string
      required: [mode, provider, lastUpdated, message]
    Market:
      type: string
      enum: [points, rebounds, assists, threes, steals, blocks, turnovers, pra]
    Team:
      type: object
      properties:
        id: { type: string }
        abbreviation: { type: string }
        name: { type: string }
        city: { type: string }
        conference: { type: string, enum: [East, West] }
        division: { type: string }
        color: { type: string }
      required: [id, abbreviation, name, city, conference, division, color]
    Game:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date }
        tipoff: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, live, final] }
        homeTeam: { $ref: "#/components/schemas/Team" }
        awayTeam: { $ref: "#/components/schemas/Team" }
        homeScore: { type: ["integer", "null"] }
        awayScore: { type: ["integer", "null"] }
        period: { type: ["integer", "null"] }
        clock: { type: ["string", "null"] }
      required: [id, date, tipoff, status, homeTeam, awayTeam, homeScore, awayScore, period, clock]
    Player:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        team: { $ref: "#/components/schemas/Team" }
        position: { type: string }
        jerseyNumber: { type: ["string", "null"] }
        status: { type: string }
        headshotUrl: { type: ["string", "null"], format: uri }
        points: { type: number }
        rebounds: { type: number }
        assists: { type: number }
        threes: { type: number }
        steals: { type: number }
        blocks: { type: number }
        turnovers: { type: number }
        minutes: { type: number }
        usageRate: { type: number }
      required: [id, name, team, position, jerseyNumber, status, headshotUrl, points, rebounds, assists, threes, steals, blocks, turnovers, minutes, usageRate]
    GameLog:
      type: object
      properties:
        date: { type: string, format: date }
        opponent: { type: string }
        minutes: { type: number }
        points: { type: integer }
        rebounds: { type: integer }
        assists: { type: integer }
        threes: { type: integer }
        steals: { type: integer }
        blocks: { type: integer }
        turnovers: { type: integer }
      required: [date, opponent, minutes, points, rebounds, assists, threes, steals, blocks, turnovers]
    PlayerDetail:
      type: object
      properties:
        player: { $ref: "#/components/schemas/Player" }
        recentGames:
          type: array
          items: { $ref: "#/components/schemas/GameLog" }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [player, recentGames, dataStatus]
    TeamDetail:
      type: object
      properties:
        team: { $ref: "#/components/schemas/Team" }
        wins: { type: integer }
        losses: { type: integer }
        pace: { type: number }
        offensiveRating: { type: number }
        defensiveRating: { type: number }
        roster:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [team, wins, losses, pace, offensiveRating, defensiveRating, roster, dataStatus]
    Prop:
      type: object
      properties:
        id: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        team: { type: string }
        opponent: { type: string }
        market: { $ref: "#/components/schemas/Market" }
        line: { type: ["number", "null"] }
        projection: { type: number }
        overProbability: { type: number, minimum: 0, maximum: 1, description: Probability of the over side from 0 to 1. }
        overOdds: { type: ["integer", "null"] }
        underOdds: { type: ["integer", "null"] }
        sportsbook: { type: ["string", "null"] }
        edge: { type: ["number", "null"], description: Difference between model projection and posted line in market units, not a percentage. }
        confidence: { type: string, enum: [low, medium, high] }
        rationale:
          type: array
          items: { type: string }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [id, playerId, playerName, team, opponent, market, line, projection, overProbability, overOdds, underOdds, sportsbook, edge, confidence, rationale, dataStatus]
    Snipe:
      allOf:
        - $ref: "#/components/schemas/Prop"
        - type: object
          properties:
            rank: { type: integer }
            signalScore: { type: number }
          required: [rank, signalScore]
    DashboardSummary:
      type: object
      properties:
        date: { type: string, format: date }
        gamesOnSlate: { type: integer }
        liveGames: { type: integer }
        playersAnalyzed: { type: integer }
        topConfidence: { type: ["number", "null"], minimum: 0, maximum: 1, description: Highest model probability from 0 to 1. }
        topEdges:
          type: array
          items: { $ref: "#/components/schemas/Snipe" }
        games:
          type: array
          items: { $ref: "#/components/schemas/Game" }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [date, gamesOnSlate, liveGames, playersAnalyzed, topConfidence, topEdges, games, dataStatus]
    Matchup:
      type: object
      properties:
        game: { $ref: "#/components/schemas/Game" }
        projectedPace: { type: number }
        projectedTotal: { type: number }
        homeOffenseRating: { type: number }
        awayOffenseRating: { type: number }
        notes:
          type: array
          items: { type: string }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [game, projectedPace, projectedTotal, homeOffenseRating, awayOffenseRating, notes, dataStatus]
    LiveAlert:
      type: object
      properties:
        id: { type: string }
        gameId: { type: string }
        title: { type: string }
        detail: { type: string }
        createdAt: { type: string, format: date-time }
        kind: { type: string, enum: [score, lead_change, milestone, status] }
      required: [id, gameId, title, detail, createdAt, kind]
    LiveAlerts:
      type: object
      properties:
        mode: { type: string, enum: [demo, live, waiting, unavailable] }
        events:
          type: array
          items: { $ref: "#/components/schemas/LiveAlert" }
        dataStatus: { $ref: "#/components/schemas/DataStatus" }
      required: [mode, events, dataStatus]
    ModelPerformance:
      type: object
      properties:
        market: { $ref: "#/components/schemas/Market" }
        sampleSize: { type: integer }
        hitRate: { type: ["number", "null"], minimum: 0, maximum: 1, description: Historical hit rate from 0 to 1. }
        averageError: { type: ["number", "null"] }
        roi: { type: ["number", "null"] }
        status: { type: string, enum: [demo, tracking, verified] }
      required: [market, sampleSize, hitRate, averageError, roi, status]
    AuditRecord:
      type: object
      properties:
        id: { type: string }
        playerName: { type: string }
        team: { type: string }
        market: { $ref: "#/components/schemas/Market" }
        projection: { type: number }
        dataInputs:
          type: array
          items: { type: string }
        adjustments:
          type: array
          items: { type: string }
        recordedAt: { type: string, format: date-time }
        status: { type: string, enum: [demo, verified] }
      required: [id, playerName, team, market, projection, dataInputs, adjustments, recordedAt, status]

