kind = "web"
previewPath = "/"
title = "RimRaider"
description = "An NBA research terminal with live ESPN schedules, scores, rosters, injuries and sportsbook game lines, plus matchup, player and team research and browser-local watchlists. Player props and projections stay empty until a props provider is connected."
version = "1.0.0"
id = "artifacts/nba-snipes"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24688

[services.development]
run = "pnpm --filter @workspace/nba-snipes run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nba-snipes", "run", "build" ]
serve = "static"
publicDir = "artifacts/nba-snipes/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24688"
BASE_PATH = "/"
