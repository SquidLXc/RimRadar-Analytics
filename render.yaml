services:
  - type: web
    name: nba-snipes-analytics
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:render
    startCommand: pnpm run start:render
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DUNKAPI_API_KEY
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: AUDIT_STORE_PATH
        value: /tmp/rimraider-audit.json
